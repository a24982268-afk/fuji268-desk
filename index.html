<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>蹦火仔 接團台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one column, phone first. Section nav (團單/導覽員/遊程/設定), then per-section content. Booking cards carry the workflow: 成單 -> 群組找導覽員 -> 排定 -> 通知. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --fg:#1b1e22; --muted:#5d6670; --line:#d3d8dd;
  --ember:#c2410c; --ember-fg:#ffffff; --ember-soft:#fde7dc;
  --ok:#17803d; --ok-soft:#dcf3e3; --warn:#9a6700; --warn-soft:#fbefc8; --bad:#b42318; --bad-soft:#fde4e1; --gray-soft:#e3e6e9; --info:#1d5fa8; --info-soft:#dce9f8;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1f2226; --fg:#eceff2; --muted:#9aa4ae; --line:#363b41;
  --ember:#ff8a4c; --ember-fg:#1a0d05; --ember-soft:#3a2216;
  --ok:#5fd68a; --ok-soft:#173824; --warn:#f0c75e; --warn-soft:#3b3012; --bad:#ff8f84; --bad-soft:#40201c; --gray-soft:#2c3035; --info:#7db6f2; --info-soft:#17304d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1f2226; --fg:#eceff2; --muted:#9aa4ae; --line:#363b41;
  --ember:#ff8a4c; --ember-fg:#1a0d05; --ember-soft:#3a2216;
  --ok:#5fd68a; --ok-soft:#173824; --warn:#f0c75e; --warn-soft:#3b3012; --bad:#ff8f84; --bad-soft:#40201c; --gray-soft:#2c3035; --info:#7db6f2; --info-soft:#17304d; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:900;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
button{font:inherit;cursor:pointer}
.primary{background:var(--ember);color:var(--ember-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:500;font-size:14px}
.ghost.danger{color:var(--bad)}
.ghost.on{background:var(--ember);border-color:var(--ember);color:var(--ember-fg)}
.ghost.warnb{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.nav button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:9px 4px;border-radius:8px;min-width:0}
.nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:112px}
.day small{display:block;color:var(--muted);font-size:12px}
.day small.lack{color:var(--bad);font-weight:700}
.day b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;overflow-x:auto}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h3{margin:0;font-size:17px;font-weight:700;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px}
.meta b{color:var(--fg);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gray-soft);color:var(--fg);white-space:nowrap}
.pill.s-待確認{background:var(--warn-soft);color:var(--warn)}
.pill.s-已成單{background:var(--info-soft);color:var(--info)}
.pill.s-導覽員已排定{background:var(--ok-soft);color:var(--ok)}
.pill.s-已通知導覽員{background:var(--ok-soft);color:var(--ok)}
.pill.s-已完成{background:var(--gray-soft);color:var(--muted)}
.pill.s-取消{background:var(--bad-soft);color:var(--bad)}
.pill.lack{background:var(--bad-soft);color:var(--bad)}
.pill.okp{background:var(--ok-soft);color:var(--ok)}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word;margin:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts select{font:inherit;font-size:14px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;padding:10px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
textarea{min-height:74px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.msg{font-size:13px;color:var(--muted)}
.msg.err{color:var(--bad);font-weight:500}
.tpl{background:var(--ember-soft);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:14px;margin:0;font-family:var(--font)}
.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>接團台</h1><p class="sub" id="sync" role="status">連線中…</p></div>
    <button class="primary" id="addBtn" type="button" hidden>新增團單</button>
  </div>

  <!-- 登入 -->
  <form class="card" id="loginForm" hidden autocomplete="on">
    <p class="sec">請輸入共用密碼</p>
    <input type="text" name="username" value="蹦火仔接團台" autocomplete="username" hidden>
    <label>密碼<input id="lPw" type="password" autocomplete="current-password" required></label>
    <div class="acts"><button class="primary" type="submit" id="lBtn">登入</button><span class="msg" id="lMsg" role="status"></span></div>
    <p class="msg" style="margin:0">密碼由店家在 Google 試算表設定。登入後這支手機 30 天內不用再輸入。</p>
  </form>

  <div class="nav" id="nav" role="group" aria-label="功能" hidden></div>

  <!-- 團單 -->
  <section id="v-bookings" class="col" hidden>
    <div class="stats" id="stats"></div>
    <div class="days" id="days" aria-label="未來 14 天已成單的團"></div>

    <form class="card" id="form" hidden autocomplete="off">
      <label id="pasteBox">貼上客人複製來的預約內容（自動帶入下方欄位）
        <textarea id="paste" placeholder="把 LINE 或臉書收到的【蹦火仔 預約詢問】整段貼在這裡"></textarea>
      </label>
      <div class="grid">
        <label>類型<select id="fType"><option>散客</option><option>學校</option><option>公司團體</option></select></label>
        <label>學校／單位名稱<input id="fOrg"></label>
        <label>聯絡人<input id="fName"></label>
        <label>手機<input id="fPhone" inputmode="tel"></label>
        <label>日期<input id="fDate" type="date"></label>
        <label>集合時間<input id="fTime" type="time"></label>
        <label>大人<input id="fAdult" type="number" min="0" inputmode="numeric"></label>
        <label>小孩<input id="fKid" type="number" min="0" inputmode="numeric"></label>
        <label>遊程<select id="fTour"></select></label>
        <label>抵達時段（客人填的）<input id="fSlot"></label>
        <label>報價（元）<input id="fQuote" type="number" min="0" inputmode="numeric"></label>
        <label>訂金（元）<input id="fDeposit" type="number" min="0" inputmode="numeric"></label>
      </div>
      <label>遊覽車／停車<input id="fBus" placeholder="例：遊覽車 2 輛，10:00 到"></label>
      <label>用餐與飲食禁忌<input id="fMeal" placeholder="例：素食 3 份、花生過敏 1 位"></label>
      <label>本團客製行程內容（選填，客製行程時填寫，會一併傳給導覽員）<textarea id="fTourNote"></textarea></label>
      <label>備註（單據、備案日期…）<textarea id="fNote"></textarea></label>
      <div class="acts">
        <button class="primary" type="submit" id="saveBtn">儲存團單</button>
        <button class="ghost" type="button" id="cancelBtn">取消</button>
        <span class="msg" id="fMsg" role="status"></span>
      </div>
    </form>

    <div class="tabs" id="tabs" role="group" aria-label="狀態篩選"></div>
    <div id="list" class="col"></div>
  </section>

  <!-- 導覽員 -->
  <section id="v-guides" class="col" hidden>
    <form class="card" id="gForm" autocomplete="off">
      <p class="sec">新增導覽員</p>
      <div class="grid">
        <label>姓名<input id="gName"></label>
        <label>備註（選填）<input id="gNote" placeholder="例：英語、只能週末"></label>
      </div>
      <div class="acts"><button class="primary" type="submit">加入名單</button><span class="msg" id="gMsg" role="status"></span></div>
    </form>
    <div id="gList" class="col"></div>
  </section>

  <!-- 遊程 -->
  <section id="v-tours" class="col" hidden>
    <form class="card" id="tForm" autocomplete="off">
      <p class="sec" id="tHead">新增遊程</p>
      <label>遊程名稱<input id="tName" placeholder="例：金山半日遊"></label>
      <label>集合地點<input id="tMeet"></label>
      <label>遊程內容（會原文傳給導覽員）<textarea id="tContent" style="min-height:120px" placeholder="依時間順序寫出當天行程、注意事項"></textarea></label>
      <div class="acts"><button class="primary" type="submit" id="tSave">儲存遊程</button><button class="ghost" type="button" id="tCancel" hidden>取消編輯</button><span class="msg" id="tMsg" role="status"></span></div>
    </form>
    <div id="tList" class="col"></div>
  </section>

  <!-- 設定 -->
  <section id="v-settings" class="col" hidden>
    <form class="card" id="sForm">
      <p class="sec">導覽員配置</p>
      <label>每位導覽員最多帶幾人<input id="sPer" type="number" min="1" inputmode="numeric" placeholder="例：20"></label>
      <p class="msg" style="margin:0">設定後，每個團單會依總人數自動算出需要幾位導覽員，不足時會標紅。</p>
      <div class="acts"><button class="primary" type="submit">儲存</button><span class="msg" id="sMsg" role="status"></span></div>
    </form>
    <form class="card" id="mForm">
      <p class="sec">船班名冊</p>
      <p class="msg" style="margin:0">每天早上 7 點會自動產生 3 天後所有已成單團的旅客名冊（也會更新 1、2 天後的），放在店家 Google 雲端硬碟的「蹦火仔船班名冊」資料夾，打開 PDF 就能列印。名單臨時有變動，可以在這裡重新產生：</p>
      <label>日期<input id="mDate" type="date" required></label>
      <div class="acts"><button class="primary" type="submit" id="mBtn">產生名冊</button><span class="msg" id="mMsg" role="status"></span></div>
      <div class="acts" id="mLinks"></div>
    </form>
    <div class="card">
      <p class="sec">這支手機</p>
      <p class="msg" style="margin:0">登出後要重新輸入密碼才能看到資料。手機遺失或同事離職時，請店家到 Google 試算表的「接團台」選單更改密碼或讓所有裝置重新登入。</p>
      <div class="acts"><button class="ghost danger" type="button" id="logoutBtn">登出這支手機</button></div>
    </div>
  </section>
</div>

<script>
(function(){
  /* 後端：Google 試算表的 Apps Script 網頁應用程式網址（不是密碼，密碼只存在 Google 那邊） */
  var API_URL="https://script.google.com/macros/s/AKfycbyl_kkWtZAvfw4dfnO-rv9SlXLQDa8OelToqGNMlwAqdQ68OTNmv1eZiBdV0DMscAUW4Q/exec";
  var TOKEN_KEY="fuji268-desk-token";
  var POLL_MS=15000;

  var STATUS=["待確認","已成單","導覽員已排定","已通知導覽員","已完成","取消"];
  var ACTIVE=["已成單","導覽員已排定","已通知導覽員"];
  var VIEWS=[["bookings","團單"],["guides","導覽員"],["tours","遊程"],["settings","設定"]];
  var bookings=[],guides=[],tours=[],perGuide=0;
  var view="bookings",filter="全部",editId=null,editTour=null,armed=null,open={};
  var token=null,authed=false,canWrite=true,seq=0,appliedSeq=0,lastJson="",lastSync=null,pollTimer=null;
  var WRITES={add:1,update:1,"delete":1,settings:1},inflight=0,writesStarted=0,queue=Promise.resolve(),errMsg="";
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function pad(n){return String(n).padStart(2,"0")}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function today(){return iso(new Date())}
  function addDays(s,n){var p=s.split("-");return iso(new Date(+p[0],+p[1]-1,+p[2]+n))}
  function wd(s){var p=s.split("-");return "日一二三四五六"[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
  function md(s){if(!s)return"日期未定";var p=s.split("-");return (+p[1])+"/"+(+p[2])+"（"+wd(s)+"）"}
  function total(r){return (+r.adult||0)+(+r.kid||0)}
  function need(r){return perGuide>0?Math.ceil(total(r)/perGuide):0}
  function gl(r){return Array.isArray(r.guides)?r.guides:[]}
  function who(r){return r.org?(r.org+"（"+(r.name||"未填聯絡人")+"）"):(r.name||"未填聯絡人")}
  function tourOf(r){for(var i=0;i<tours.length;i++)if(tours[i].id===r.tourId)return tours[i];return null}

  /* ---------- 後端連線 ---------- */
  function loadToken(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}}
  function saveToken(t){try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY)}catch(e){}}
  function call(action,extra){
    if(!API_URL)return Promise.reject({code:"no_backend"});
    var body={action:action,token:token},my=++seq,quiet=!inflight,w0=writesStarted;
    if(extra)Object.keys(extra).forEach(function(k){body[k]=extra[k]});
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow",cache:"no-store"})
      .then(function(r){if(!r.ok)throw {code:"unavailable"};return r.json()},function(){throw {code:"unavailable"}})
      .then(function(res){
        if(!res||!res.ok){
          if(res&&res.code==="auth")showLogin("登入已過期或密碼已更改，請重新輸入密碼。");
          throw res||{code:"error"};
        }
        // 還有別的修改在排隊、或讀取期間有修改送出時，不要用（可能較舊的）伺服器資料蓋掉畫面
        var ok=WRITES[action]?inflight===1:(quiet&&!inflight&&writesStarted===w0);
        if(res.data&&my>appliedSeq&&ok){appliedSeq=my;apply(res.data)}
        return res;
      });
  }
  function apply(d){
    lastSync=new Date();
    var j=JSON.stringify(d);
    if(j!==lastJson){
      lastJson=j;
      bookings=d.bookings||[];guides=d.guides||[];tours=d.tours||[];
      perGuide=d.settings&&+d.settings.perGuide>0?+d.settings.perGuide:0;
      render();
    }
    syncLine();
  }
  function syncLine(){
    if(!authed)return;
    if(inflight)$("sync").textContent="背景儲存中，還有 "+inflight+" 筆（可以繼續操作，請先不要關閉頁面）";
    else if(errMsg)$("sync").textContent=errMsg;
    else $("sync").textContent="團單共 "+bookings.length+" 筆，每 15 秒自動同步"+(lastSync?"（最後更新 "+pad(lastSync.getHours())+":"+pad(lastSync.getMinutes())+":"+pad(lastSync.getSeconds())+"）":"");
  }
  function refresh(){
    if(!authed||document.hidden)return Promise.resolve();
    return call("load").catch(fail);
  }
  function startPolling(){stopPolling();pollTimer=setInterval(refresh,POLL_MS)}
  function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});

  window.addEventListener("beforeunload",function(e){if(inflight){e.preventDefault();e.returnValue=""}});

  /* 修改先顯示在畫面上，再依序送到試算表；失敗就還原成試算表上的資料 */
  function write(action,extra,local){
    if(local){local();render()}
    inflight++;writesStarted++;syncLine();
    var p=queue.then(function(){return call(action,extra)});
    queue=p.then(function(){errMsg=""},function(err){
      if(err&&err.code==="auth")return;
      var c=err&&err.code;
      errMsg="剛剛有一筆沒存到（"+(c==="unavailable"?"網路不穩":c==="not_found"?"資料已被其他人刪除":"伺服器錯誤")+"），畫面已還原，請再試一次。";
      lastJson="";
    }).then(function(){
      inflight--;syncLine();
      if(!inflight&&!lastJson)refresh();
    });
    return p;
  }
  function tmpId(){return "tmp-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function isTmp(id){return String(id).indexOf("tmp-")===0}
  function listOf(c){return c==="bookings"?bookings:c==="guides"?guides:tours}
  function setList(c,v){if(c==="bookings")bookings=v;else if(c==="guides")guides=v;else tours=v}
  var db={
    add:function(coll,data){
      var o=Object.assign({},data,{id:tmpId()});if(coll==="bookings")o.createdAt=Date.now();
      return write("add",{collection:coll,data:data},function(){listOf(coll).push(o)});
    },
    update:function(coll,id,data){
      return write("update",{collection:coll,id:id,data:data},function(){listOf(coll).forEach(function(r){if(r.id===id)Object.assign(r,data)})});
    },
    remove:function(coll,id){
      return write("delete",{collection:coll,id:id},function(){setList(coll,listOf(coll).filter(function(r){return r.id!==id}))});
    },
    settings:function(data){
      return write("settings",{data:data},function(){perGuide=+data.perGuide>0?+data.perGuide:0});
    }
  };

  function fail(err){
    var c=err&&err.code,m="操作失敗，請稍後再試";
    if(c==="auth")return;
    if(c==="unavailable")m="網路不穩，請稍後再試";
    else if(c==="not_found")m="這筆資料已被其他人刪除";
    else if(c==="no_backend")m="還沒設定後端網址";
    $("sync").textContent=m;
  }
  function copy(text,btn){
    var old=btn.textContent;
    function done(m){btn.textContent=m;setTimeout(function(){btn.textContent=old},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done("已複製")},function(){done("請手動選取")})}else done("請手動選取");
  }
  function upd(id,data){

  /* 旅客名單：一行一位，或一個人分好幾行都可以 */
  function paxOf(r){return Array.isArray(r.passengers)?r.passengers:[]}
  var TWID="ABCDEFGHJKLMNPQRSTUVXYWZIO";
  function idOk(s){
    if(!/^[A-Z][1289]\d{8}$/.test(s))return null;  // 不是台灣身分證格式（可能是護照），不檢查
    var n=TWID.indexOf(s[0])+10,sum=Math.floor(n/10)+(n%10)*9;
    for(var i=1;i<9;i++)sum+=(+s[i])*(9-i);
    return (sum+(+s[9]))%10===0;
  }
  function normDate(t){
    var m=t.match(/^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/)||t.match(/^(19\d{2}|20\d{2})(\d{2})(\d{2})$/)||t.match(/^(\d{2,3})(\d{2})(\d{2})$/);
    if(!m)return null;
    var y=+m[1],mo=+m[2],d=+m[3];
    if(y<1911)y+=1911;
    if(mo<1||mo>12||d<1||d>31||y>new Date().getFullYear())return null;
    return y+"-"+pad(mo)+"-"+pad(d);
  }
  function classify(tok){
    var x=tok.replace(/^[^\d:：]*[:：]/,"");  // 去掉「姓名：」「身分證：」這類標籤
    if(!x)return null;
    if(/^(\+?886-?|0)9\d{2}-?\d{3}-?\d{3}$/.test(x))return ["phone",x.replace(/-/g,"").replace(/^\+?886/,"0")];
    if(/^[A-Za-z][1289]\d{8}$/.test(x))return ["id",x.toUpperCase()];
    var d=normDate(x);if(d)return ["birth",d];
    if(/^[A-Za-z0-9]{6,12}$/.test(x)&&/\d/.test(x))return ["id",x.toUpperCase()];
    return ["name",x];
  }
  function parsePax(txt){
    var out=[],cur=null;
    function close(){if(cur&&(cur.name||cur.id))out.push(cur);cur=null}
    txt.split(/\r?\n/).forEach(function(line){
      line=line.replace(/^\s*(\d{1,3}[.、)）]|[(（]\d{1,3}[)）])\s*/,"").replace(/(09\d{2})[\s-](\d{3})[\s-](\d{3})/g,"$1$2$3").trim();
      if(!line)return;
      var f={};
      line.split(/[\s,，、;；|｜\t]+/).forEach(function(tok){
        var c=classify(tok);if(!c)return;
        if(c[0]==="name")f.name=f.name?f.name+" "+c[1]:c[1];else if(!f[c[0]])f[c[0]]=c[1];
      });
      var keys=Object.keys(f);
      if(!keys.length)return;
      if(keys.length===1&&f.name&&/姓名|身分證|護照|生日|出生|電話/.test(f.name))return;  // 標題列
      if(keys.length>1){close();cur={name:"",id:"",birth:"",phone:""};keys.forEach(function(k){cur[k]=f[k]});close();return}
      var k=keys[0];
      if(!cur||cur[k])close();
      if(!cur)cur={name:"",id:"",birth:"",phone:""};
      cur[k]=f[k];
    });
    close();
    return out;
  }
  function paxText(list){return list.map(function(p){return [p.name,p.id,p.birth,p.phone].filter(Boolean).join(" ")}).join("\n")}

    var ta=el("textarea");ta.style.minHeight="140px";ta.setAttribute("aria-label","旅客名單");ta.dataset.pax=r.id;
    ta.value=paxDraft[r.id]!=null?paxDraft[r.id]:paxText(paxOf(r));

    ta.oninput=function(){paxDraft[r.id]=ta.value;show()};

      var left=el("div");left.appendChild(el("h3",null,g.name));if(g.note)left.appendChild(el("p","sub",g.note));
      var up=bookings.filter(function(r){return r.date>=t&&ACTIVE.indexOf(r.status)>=0&&gl(r).indexOf(g.name)>=0}).sort(function(a,b){return a.date.localeCompare(b.date)});
      left.appendChild(el("p","sub",up.length?"待帶團："+up.map(function(r){return md(r.date)}).join("、"):"目前沒有待帶的團"));
      h.appendChild(left);
      var del=el("button","ghost danger",armed==="g"+g.id?"再按一次確認刪除":"刪除");del.type="button";del.disabled=!canWrite||isTmp(g.id);
      del.onclick=function(){if(armed!=="g"+g.id){armed="g"+g.id;render();return}armed=null;db.remove("guides",g.id).catch(fail)};
      h.appendChild(del);c.appendChild(h);L.appendChild(c);
    });
  }
  /* tours view */
  function renderTours(){
    var L=$("tList");L.textContent="";
    if(!tours.length){L.appendChild(el("div","card empty","還沒有遊程。把常帶的行程寫一次，之後團單選取即可，通知導覽員時會自動帶入內容。"));return}
    tours.forEach(function(t){
      var c=el("div","card item"),h=el("div","head");
      var left=el("div");left.appendChild(el("h3",null,t.name));if(t.meet)left.appendChild(el("p","sub","集合：「"+t.meet+"」"));
      h.appendChild(left);c.appendChild(h);
      if(t.content)c.appendChild(el("p","note",t.content));
      var acts=el("div","acts");
      var ed=el("button","ghost","編輯");ed.type="button";ed.disabled=!canWrite||isTmp(t.id);
      ed.onclick=function(){editTour=t.id;$("tName").value=t.name||"";$("tMeet").value=t.meet||"";$("tContent").value=t.content||"";render();$("tName").focus()};
      acts.appendChild(ed);
      var del=el("button","ghost danger",armed==="t"+t.id?"再按一次確認刪除":"刪除");del.type="button";del.disabled=!canWrite||isTmp(t.id);
      del.onclick=function(){if(armed!=="t"+t.id){armed="t"+t.id;render();return}armed=null;db.remove("tours",t.id).catch(fail)};
      acts.appendChild(del);c.appendChild(acts);L.appendChild(c);
    });
  }
  function renderTourForm(){
    $("tHead").textContent=editTour?"編輯遊程":"新增遊程";
    $("tCancel").hidden=!editTour;
    var cur=$("fTour").value,s=$("fTour");s.textContent="";
    var o0=el("option","", "未選");o0.value="";s.appendChild(o0);
    tours.forEach(function(t){if(isTmp(t.id))return;var o=el("option",null,t.name);o.value=t.id;s.appendChild(o)});
    s.value=cur;
  }
  function render(){
    renderNav();
    if(!authed)return;
    // 背景同步重畫時，保留正在打字的旅客名單游標位置
    var a=document.activeElement,foc=a&&a.dataset&&a.dataset.pax,sel=foc?[a.selectionStart,a.selectionEnd]:null;
    if(view==="bookings"){renderStats();renderTabs();renderList()}
    if(foc){var nt=document.querySelector('textarea[data-pax="'+foc+'"]');if(nt){nt.focus();try{nt.setSelectionRange(sel[0],sel[1])}catch(e){}}}
    if(view==="guides")renderGuides();
    if(view==="tours"){renderTourForm();renderTours()}
    if(view==="settings"&&document.activeElement!==$("sPer"))$("sPer").value=perGuide||"";
  }

  /* booking form */
  function parse(txt){
    var o={};
    txt.split(/\r?\n/).forEach(function(line){
      var i=line.search(/[：:]/);if(i<0)return;
      var k=line.slice(0,i).trim(),v=line.slice(i+1).trim();
      if(k==="類型"&&/散客|學校|公司團體/.test(v))o.type=v.match(/散客|學校|公司團體/)[0];
      else if(k==="學校"||k==="單位")o.org=v;
      else if(k==="聯絡人"&&v.indexOf("（未填）")<0)o.name=v;
      else if(k==="手機"&&v.indexOf("（未填）")<0)o.phone=v;
      else if(k==="首選日期"){var m=v.match(/(\d{4})\/(\d{2})\/(\d{2})/);if(m)o.date=m[1]+"-"+m[2]+"-"+m[3]}
      else if(k==="抵達時段")o.slot=v;
      else if(k==="人數"){
        var a=v.match(/(?:全票|大人)\s*(\d+)/),b=v.match(/7[–-]12\s*歲\s*(\d+)/),c=v.match(/6\s*歲以下\s*(\d+)/),kk=v.match(/小孩\s*(\d+)/);
        if(a)o.adult=a[1];
        if(b||c)o.kid=String((b?+b[1]:0)+(c?+c[1]:0));else if(kk)o.kid=kk[1];
        if(b||c)o.note=(o.note?o.note+"\n":"")+"人數明細："+v.replace(/，共.*$/,"");
      }
      else if(k==="遊程")o.tourName=v;
      else if(k==="預估費用"){var q=v.replace(/[^\d]/g,"");if(q)o.quote=q}
      else if(k==="交通")o.bus=v;
      else if(k==="用餐")o.meal=v;
      else if(["備案日期","LINE","年級／班級","帶隊老師","單據","備註"].indexOf(k)>=0){o.note=(o.note?o.note+"\n":"")+k+"："+v}
    });
    return o;
  }
  var FIELDS={type:"fType",org:"fOrg",name:"fName",phone:"fPhone",date:"fDate",time:"fTime",adult:"fAdult",kid:"fKid",tourId:"fTour",slot:"fSlot",quote:"fQuote",deposit:"fDeposit",bus:"fBus",meal:"fMeal",note:"fNote",tourNote:"fTourNote"};
  function fillForm(o){
    if(o.tourName){for(var i=0;i<tours.length;i++)if(tours[i].name===o.tourName)o.tourId=tours[i].id}
    Object.keys(FIELDS).forEach(function(k){if(o[k]!=null&&o[k]!=="")$(FIELDS[k]).value=o[k]})}
  function startEdit(r){
    editId=r.id;$("form").reset();renderTourForm();fillForm(r);
    $("pasteBox").hidden=true;$("saveBtn").textContent="儲存修改";$("form").hidden=false;$("fMsg").textContent="";
    $("form").scrollIntoView({block:"start"});
  }
  function closeForm(){editId=null;$("form").reset();$("form").hidden=true;$("pasteBox").hidden=false;$("saveBtn").textContent="儲存團單";$("saveBtn").disabled=false}
  $("paste").addEventListener("input",function(){var o=parse($("paste").value);if(Object.keys(o).length>1)fillForm(o)});
  $("addBtn").onclick=function(){
    if(!$("form").hidden&&!editId){closeForm();return}
    editId=null;$("form").reset();renderTourForm();$("pasteBox").hidden=false;$("saveBtn").textContent="儲存團單";$("form").hidden=false;$("paste").focus();
  };
  $("cancelBtn").onclick=closeForm;
  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    if(!authed){$("fMsg").textContent="目前無法儲存";return}
    var doc={type:$("fType").value,org:$("fOrg").value.trim(),name:$("fName").value.trim(),phone:$("fPhone").value.trim(),
      date:$("fDate").value,time:$("fTime").value,slot:$("fSlot").value.trim(),adult:+$("fAdult").value||0,kid:+$("fKid").value||0,
      tourId:$("fTour").value,note:$("fNote").value.trim(),bus:$("fBus").value.trim(),meal:$("fMeal").value.trim(),
      tourNote:$("fTourNote").value.trim(),quote:+$("fQuote").value||0,deposit:+$("fDeposit").value||0};
    if(!doc.name&&!doc.org){$("fMsg").textContent="請至少填聯絡人或單位名稱";return}
    var id=editId,p;
    if(id){p=db.update("bookings",id,doc)}
    else{doc.depositPaid=false;doc.guides=[];doc.status="待確認";p=db.add("bookings",doc)}
    closeForm();
    // 沒存到就把剛填的內容放回表單，免得重打
    p.catch(function(err){
      if(err&&err.code==="auth")return;
      if(!$("form").hidden)return;
      $("form").reset();renderTourForm();fillForm(doc);editId=id;
      $("pasteBox").hidden=!!id;$("saveBtn").textContent=id?"儲存修改":"儲存團單";$("form").hidden=false;
      $("fMsg").textContent="剛剛沒有存到，請再按一次儲存";
      $("form").scrollIntoView({block:"start"});
    });
  });

  /* guides / tours / settings forms */
  $("gForm").addEventListener("submit",function(e){
    e.preventDefault();var name=$("gName").value.trim();
    if(!name){$("gMsg").textContent="請填姓名";return}
    if(name.indexOf("、")>=0){$("gMsg").textContent="姓名不能有「、」";return}
    if(guides.some(function(g){return g.name===name})){$("gMsg").textContent="名單已有同名導覽員";return}
    var note=$("gNote").value.trim();
    $("gForm").reset();$("gMsg").textContent="";
    db.add("guides",{name:name,note:note}).catch(function(err){
      if(err&&err.code==="auth")return;
      if(!$("gName").value){$("gName").value=name;$("gNote").value=note}
      $("gMsg").textContent="剛剛沒有存到，請再按一次";
    });
  });
  $("tForm").addEventListener("submit",function(e){
    e.preventDefault();var d={name:$("tName").value.trim(),meet:$("tMeet").value.trim(),content:$("tContent").value.trim()};
    if(!d.name){$("tMsg").textContent="請填遊程名稱";return}
    var id=editTour,p=id?db.update("tours",id,d):db.add("tours",d);
    editTour=null;$("tForm").reset();$("tMsg").textContent="";render();
    p.catch(function(err){
      if(err&&err.code==="auth")return;
      if(!$("tName").value){editTour=id;$("tName").value=d.name;$("tMeet").value=d.meet;$("tContent").value=d.content;render()}
      $("tMsg").textContent="剛剛沒有存到，請再按一次儲存";
    });
  });
  $("tCancel").onclick=function(){editTour=null;$("tForm").reset();render()};
  $("mForm").addEventListener("submit",function(e){
    e.preventDefault();var d=$("mDate").value;if(!d)return;
    $("mBtn").disabled=true;$("mLinks").textContent="";$("mMsg").className="msg";$("mMsg").textContent="產生中，約需 10～20 秒…";
    queue.then(function(){return call("manifest",{date:d})}).then(function(res){
      var m=res.manifest||{};
      if(!m.groups){$("mMsg").textContent=md(d)+" 沒有已成單的團，沒有產生名冊。";return}
      $("mMsg").textContent=md(d)+"：共 "+m.groups+" 團、"+m.count+" 人，名單已填 "+m.listed+" 人。";
      [["開啟 PDF（列印用）",m.pdfUrl],["開啟試算表版",m.sheetUrl]].forEach(function(x){
        if(!x[1])return;
        var a=el("a","ghost",x[0]);a.href=x[1];a.target="_blank";a.rel="noopener";a.style.textDecoration="none";$("mLinks").appendChild(a);
      });
      $("mLinks").appendChild(el("p","msg","需用店家的 Google 帳號才能開啟。"));
    },function(err){
      if(err&&err.code==="auth")return;
      $("mMsg").className="msg err";$("mMsg").textContent="產生失敗："+(err&&err.code==="unavailable"?"網路不穩":(err&&err.message)||"請確認後端已更新")+"，請稍後再試。";
    }).then(function(){$("mBtn").disabled=false});
  });
  $("sForm").addEventListener("submit",function(e){
    e.preventDefault();var n=+$("sPer").value||0;
    $("sMsg").textContent="已儲存";
    db.settings({perGuide:n}).catch(function(){$("sMsg").textContent="剛剛沒有存到，請再按一次儲存"});
  });

  function start(){
    token=loadToken();
    if(!API_URL){showLogin("還沒設定後端網址。");return}
    if(!token){showLogin();return}
    $("sync").textContent="連線中…";
    call("load").then(enter,function(err){
      if(err&&err.code==="auth")return;
      authed=true;render();startPolling();fail(err);
    });
  }
  render();
  start();
})();
</script>
</body>
</html>
